[project]
name = "djcp-alarm-ai"
version = "0.1.0"
description = "Standalone alarm and tag description based fault analysis backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
djcp-llm-smoke-test = "djcp_alarm_ai.cli.smoke_llm:main"
djcp-seed-test-alarm = "djcp_alarm_ai.cli.seed_test_alarm:main"
djcp-test-scenarios = "djcp_alarm_ai.cli.run_scenarios:main"
djcp-preprocess-manual = "djcp_alarm_ai.cli.preprocess_manual:main"
djcp-index-manual = "djcp_alarm_ai.cli.index_manual:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
djcp_alarm_ai = ["prompts/**/*.md"]
